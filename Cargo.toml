[package]
name = "aiyou"
version = "0.3.0"
edition = "2021"
description = "Teach every AI agent who you are: extract your personality and working style from your chats into a me skill, kept current with your approval"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
zip = "2"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
axum = "0.7"

[profile.release]
lto = true
strip = true
